<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOL Auction - 로컬 통계 대시보드</title>
  <!--
    이 페이지는 프로덕션 빌드 대상이 아닙니다 (index.html/vite.config.ts 어디에서도 참조하지 않음).
    npm run dev로 로컬 서버를 띄운 상태에서만 /stats.html로 접근할 수 있고,
    npm run build 결과물(dist/)에는 포함되지 않습니다.
  -->
  <link rel="stylesheet" href="/src/stats/stats.css">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
  <div class="page">
    <h1>LOL Auction - 로컬 통계 대시보드</h1>
    <p class="page-sub">로컬 전용 도구입니다. 서버로 전송되지 않으며, 업로드한 파일은 이 브라우저 탭을 벗어나지 않습니다.</p>

    <!-- 입력: 파일 업로드 또는 JSON 텍스트 직접 붙여넣기 -->
    <div id="upload-section" class="upload-box">
      <p>Firebase 콘솔 → Realtime Database → 데이터 내보내기로 받은 JSON 파일을 업로드하세요.</p>
      <input type="file" id="file-input" accept=".json,application/json">

      <div class="input-divider"><span>또는</span></div>

      <!-- 파일 업로드가 차단된 환경(사내 보안 정책 등)을 위한 대체 입력 -->
      <p>또는 JSON 텍스트를 직접 붙여넣으세요.</p>
      <!-- maxlength 없음: 대용량 JSON 전체를 그대로 붙여넣을 수 있어야 함 -->
      <textarea id="json-textarea" spellcheck="false" autocomplete="off"
                placeholder='{ "rooms": { "ROOM_XXXXX": { ... } } }'></textarea>
      <button type="button" id="btn-render-text" class="btn-render">통계 표시</button>

      <p class="privacy-note">
        입력한 데이터는 브라우저 메모리에서만 파싱되며 어디에도 저장·전송되지 않습니다.<br>
        팀원 닉네임 등 개인정보가 포함될 수 있으니 취급에 주의하세요.
      </p>
      <div id="error-box" class="error-box"></div>
    </div>

    <!-- 파싱/집계 진행 중 표시 -->
    <div id="loading-box" class="loading-box hidden">
      <span class="spinner" aria-hidden="true"></span>
      <span>통계를 생성하는 중입니다...</span>
    </div>

    <!-- 처리 후 렌더링 영역 -->
    <div id="result-section" class="hidden"></div>
  </div>

  <script type="module" src="/src/stats/stats-main.ts"></script>
</body>
</html>
